name: windows-tray

on:
  push:
    branches: [main]
    paths:
      - 'windows-tray/**'
      - '.github/workflows/windows-tray.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content windows-tray/src/ClaudeLimitsTray/ClaudeLimitsTray.csproj
          "value=$($project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)" >> $env:GITHUB_OUTPUT

      - name: Publish single-file exe
        run: dotnet publish windows-tray/src/ClaudeLimitsTray/ClaudeLimitsTray.csproj -c Release -o out -warnaserror:nullable

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeLimitsTray
          path: out/ClaudeLimitsTray.exe

      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tray-v${{ steps.version.outputs.value }}
          name: Claude Limits Tray ${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          files: out/ClaudeLimitsTray.exe
          overwrite_files: true
          body: |
            Windows tray utility showing your Claude 5-hour and weekly usage limits.
            Download `ClaudeLimitsTray.exe` and run it. Setup: see windows-tray/README.md.
